name: Test suite

on:
  workflow_call:
    inputs:
      os:
        description: Runner image to test on
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check OpenSSL
        run: openssl version
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (GUI)
        if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets --features gui -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Build server
        run: cargo build --locked
      - name: Build GUI
        if: runner.os == 'Windows'
        run: cargo build --locked --features gui
      - name: Setup scripts
        run: python tests/setup.py
      - name: HTTPS integration
        run: python tests/https.py
      - name: mTLS integration
        run: python tests/mtls.py
      - name: Encrypted key ID integration
        run: python tests/psk.py
