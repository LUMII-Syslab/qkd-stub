name: Signed Windows executable

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test-suite.yml
    with:
      os: windows-2022

  release:
    needs: test
    if: github.repository == 'LUMII-Syslab/qkd-stub' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
      SIGNER_SUBJECT: CN=Latvijas Universitātes Matemātikas un informātikas institūts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Check version and build
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'qkd-stub').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match Cargo.toml version: v$version"
          }
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/qkd-stub.exe out/qkd-stub.exe

      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign executable
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\out\qkd-stub.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: QKD endpoint simulator
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signature, run executable and hash
        run: |
          $signature = Get-AuthenticodeSignature out/qkd-stub.exe
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "Expected a valid timestamped signature, got $($signature.Status)"
          }
          if (-not $signature.SignerCertificate.Subject.StartsWith("$env:SIGNER_SUBJECT,")) {
            throw "Unexpected signer: $($signature.SignerCertificate.Subject)"
          }
          & ./out/qkd-stub.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./out/qkd-stub.exe demo init --dir "$env:RUNNER_TEMP/qkd-release-demo"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./out/qkd-stub.exe --config "$env:RUNNER_TEMP/qkd-release-demo/a.toml" check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hash = (Get-FileHash out/qkd-stub.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  qkd-stub.exe" | Set-Content out/qkd-stub.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qkd-stub-windows-x64-signed
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME out/qkd-stub.exe out/qkd-stub.exe.sha256 --verify-tag --draft --title "qkd-stub $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
