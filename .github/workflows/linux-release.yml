name: Linux executable

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test-suite.yml
    with:
      os: ubuntu-24.04

  release:
    needs: test
    if: github.repository == 'LUMII-Syslab/qkd-stub' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
      TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal --target "$TARGET"

      # A static musl build runs on any x86-64 Linux distribution, regardless of glibc version.
      - name: Check version and build
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "qkd-stub"))')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag must match Cargo.toml version: v$version" >&2
            exit 1
          fi
          cargo build --release --locked --target "$TARGET"
          mkdir out
          cp "target/$TARGET/release/qkd-stub" out/qkd-stub
          file out/qkd-stub | tee /dev/stderr | grep -E 'statically linked|static-pie linked'

      - name: Run executable
        run: |
          bin="$PWD/out/qkd-stub"
          "$bin" --version
          cd "$RUNNER_TEMP"
          "$bin" demo init --dir demo
          "$bin" --config demo/a.toml serve &
          a=$!
          "$bin" --config demo/b.toml serve &
          b=$!
          trap 'kill $a $b' EXIT
          sleep 2
          "$bin" demo verify --dir demo

      - name: Package and hash
        run: |
          cd out
          tar -czf qkd-stub-x86_64-linux.tar.gz qkd-stub
          rm qkd-stub
          sha256sum qkd-stub-x86_64-linux.tar.gz > qkd-stub-x86_64-linux.tar.gz.sha256

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/qkd-stub-x86_64-linux.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qkd-stub-linux-x86_64
          path: out/*
          if-no-files-found: error
          retention-days: 30

      # The Windows workflow may create the draft first; then only upload.
      - name: Create draft GitHub Release or add assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes='`demo init` creates a `qkd-demo` directory in the current working directory (change it with `--dir`) and refuses to run if it exists. It holds test credentials, including private keys and the shared PSK. `configure` creates `qkd-stub-data` in the working directory.'
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --draft \
            --title "qkd-stub $GITHUB_REF_NAME" --notes "$notes" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" out/*
