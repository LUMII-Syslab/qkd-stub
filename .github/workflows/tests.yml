name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check OpenSSL
        run: openssl version
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Build server
        run: cargo build --locked
      - name: Setup scripts
        run: python tests/setup.py
      - name: HTTPS integration
        run: python tests/https.py
      - name: mTLS integration
        run: python tests/mtls.py
      - name: Encrypted key ID integration
        run: python tests/psk.py
