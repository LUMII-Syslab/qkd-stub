[package]
name = "qkd-stub"
version = "0.5.0"
edition = "2024"
description = "Independent deterministic ETSI GS QKD 014 HTTPS test endpoints"
license = "MIT"

[dependencies]
aes = "0.8"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = "1"
x509-parser = { version = "0.18", features = ["verify"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
toml = "1.1.6"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
tempfile = "3"
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[features]
# Desktop dashboard (qkd-stub-gui). Off by default so CLI and Linux builds stay small.
gui = ["dep:eframe"]

[[bin]]
name = "qkd-stub"
path = "src/main.rs"

[[bin]]
name = "qkd-stub-gui"
path = "src/bin/qkd-stub-gui.rs"
required-features = ["gui"]
